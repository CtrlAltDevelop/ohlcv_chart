# Publishes the example app to https://ctrlaltdevelop.github.io/ohlcv_chart/
# Repo Settings → Pages → Source must be "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  pages:
    name: Pages
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/flutter-web-pages.yml@v1.2.0
    permissions:
      contents: read
      pages: write
      id-token: write
