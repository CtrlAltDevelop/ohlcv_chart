# Publishes the package to pub.dev when a version tag is pushed.
#
# `v<version>` publishes that version. The checks (tag on main, matches the
# pubspec, has a CHANGELOG entry) and the one-off pub.dev setup live in
# CtrlAltDevelop/ci-workflows (dart-publish.yml).

name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  publish:
    name: Publish
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/dart-publish.yml@v1.2.0
    permissions:
      contents: read
      id-token: write
    with:
      sdk: flutter
