# Publishes the package to pub.dev when a release is created.
#
# Creating a GitHub release from main tags it, and the tag is what starts this:
# `v3.1.0` publishes version 3.1.0. The checks and the one-off pub.dev setup
# live in CtrlAltDevelop/ci-workflows (dart-publish.yml).

name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  publish:
    name: Publish
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/dart-publish.yml@v1.2.0
    permissions:
      contents: read
      id-token: write
    with:
      sdk: flutter
