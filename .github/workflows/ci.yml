# Runs the tests on a pull request into main — and on nothing else.
# The job lives once in CtrlAltDevelop/ci-workflows (dart-test.yml).

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/dart-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      sdk: flutter
      runs-on: macos-latest
