publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ">=1.0.0 <2.0.0"
  ohlcv_chart:
    path: ../

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  image: ">=4.0.0 <5.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
