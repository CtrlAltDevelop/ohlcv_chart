name: ohlcv_chart
description: >-
  Candlestick and market-depth charts for Flutter, with MA, BOLL and SAR
  overlays, MACD, KDJ, RSI, WR and CCI sub-charts, signal markers and
  interactive drawing tools.
version: 1.0.0
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/ohlcv_chart
issue_tracker: https://github.com/CtrlAltDevelop/ohlcv_chart/issues

topics:
  - chart
  - candlestick
  - trading
  - finance

# Shown on the pub.dev listing. Drop the images in screenshots/ and uncomment.
# Up to 10 entries; png, jpg, gif or webp; 4 MiB each at most.
# screenshots:
#   - description: >-
#       REPLACE ME
#     path: screenshots/REPLACE_ME.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  decimal: ^3.2.4
  flutter_svg: ^2.2.3
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
