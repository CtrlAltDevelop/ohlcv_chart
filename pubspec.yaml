name: ohlcv_chart
description: >-
  Candlestick charts for Flutter with 31 indicators, 29 drawing tools and 39
  more chart widgets: depth, order flow, series, pie, treemap, sankey. Pure
  CustomPainter, no WebView.
version: 3.0.0
homepage: https://github.com/CtrlAltDevelop
repository: https://github.com/CtrlAltDevelop/ohlcv_chart
issue_tracker: https://github.com/CtrlAltDevelop/ohlcv_chart/issues

topics:
  - chart
  - candlestick
  - trading
  - finance
  - data-visualization

# Shown on the pub.dev listing. Up to 10 entries; png, jpg, gif or webp;
# 4 MiB each at most. Regenerate them with example/tool/screenshots.dart.
screenshots:
  - description: >-
      A candlestick chart with three moving averages, take-profit and
      stop-loss markers, the volume pane and a MACD sub-chart.
    path: screenshots/candles.png
  - description: >-
      Business charts: returns coloured above and below zero, profit bars,
      deposits and withdrawals with a tooltip, and a balance sparkline.
    path: screenshots/series-charts.png
  - description: >-
      A doughnut chart of holdings with the total in the centre and one slice
      exploded, beside a radar chart comparing two strategies on five metrics.
    path: screenshots/pie-radar.png
  - description: >-
      Six months of activity as a contribution graph, beside orders by hour
      and weekday with the count shown in each cell.
    path: screenshots/heatmap.png
  - description: >-
      The Ichimoku cloud and Supertrend over the candles, with Stochastic RSI
      and the Awesome oscillator in their own panes.
    path: screenshots/overlays.png
  - description: >-
      Bars floating between two values as a waterfall, beside a forecast
      inside its band with error bars every few points.
    path: screenshots/series-ranges.png
  - description: >-
      A working order and an open position, each drawn as a full-width line
      tagged on the axis with its size and unrealised P&L.
    path: screenshots/trading.png
  - description: >-
      The same market as line break, Kagi, point & figure and range bars.
    path: screenshots/bar-types.png
  - description: >-
      A ray, an arrow, a horizontal ray, a range box and a Fibonacci
      retracement.
    path: screenshots/shapes.png
  - description: >-
      A market-depth chart of cumulative bid and ask volume.
    path: screenshots/depth.png

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  decimal: ">=3.0.0 <4.0.0"
  intl: ">=0.19.0 <0.21.0"
  material_ui: ">=1.0.0 <2.0.0"

dev_dependencies:
  flutter_lints: ">=6.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
